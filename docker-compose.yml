name: crosscreek

# Cross Creek: a mock municipal water treatment plant and power substation with
# simulated PLCs, for authorised ICS/OT security training.
#
# This base file is the FLAT topology: the boundary firewall forwards freely,
# the OT network is a single flat segment (as most small utilities really are),
# and every deliberate weakness is on. It is the "how the attacks work" half.
# Fold in docker-compose.segmented.yml (./start.sh --segmented) for the
# defended topology.
#
# Every published port binds to 127.0.0.1. start.sh refuses to launch otherwise
# and status.sh re-audits. The edge and field networks are internal so nothing
# on them can reach the internet; see docs/architecture.md.

x-common: &common
  restart: unless-stopped
  init: true

services:

  # --- L3/3.5 boundary firewall --------------------------------------------
  router-fw:
    <<: *common
    build: ./net/router-fw
    container_name: crosscreek-router-fw
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      FW_MODE: "${FLAT_NETWORK:-1}"   # 1 = forward everything, 0 = zones + conduits
    networks:
      edge-net:       { ipv4_address: 172.30.10.2 }
      it-net:         { ipv4_address: 172.30.20.2 }
      dmz-net:        { ipv4_address: 172.30.30.2 }
      ot-net:         { ipv4_address: 172.30.40.2 }
    healthcheck:
      test: ["CMD-SHELL", "nft list ruleset >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- L1 controllers -----------------------------------------------------
  plc-water:
    <<: *common
    build: ./plc/water-openplc
    container_name: crosscreek-plc-water
    environment:
      MODBUS_WRITE_OPEN: "${MODBUS_WRITE_OPEN:-1}"
      PLC_WATER_PASS: "${PLC_WATER_PASS:-1100}"
      DEFAULT_CREDS: "${DEFAULT_CREDS:-1}"
      HMI_ALLOWLIST: "172.30.40.10,172.30.50.10"   # water HMI, process-sim
    ports:
      - "127.0.0.1:5020:502"     # Modbus/TCP
      - "127.0.0.1:8073:8080"    # OpenPLC runtime web UI (logic upload, Session 4)
    networks:
      ot-net:  { ipv4_address: 172.30.40.20 }
      sim-net: { ipv4_address: 172.30.50.10 }
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',502),3)\""]
      interval: 15s
      timeout: 5s
      retries: 6

  plc-dosing:
    <<: *common
    build: ./plc/dosing-enip
    container_name: crosscreek-plc-dosing
    environment:
      ENIP_ALLOW_LOGIC_DOWNLOAD: "${ENIP_ALLOW_LOGIC_DOWNLOAD:-1}"
      PLC_DOSING_PASS: "${PLC_DOSING_PASS:-1100}"
    ports:
      - "127.0.0.1:4840:44818"   # EtherNet/IP (CIP)
    networks:
      ot-net:  { ipv4_address: 172.30.40.21 }
      sim-net: { ipv4_address: 172.30.50.11 }
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',44818),3)\""]
      interval: 15s
      timeout: 5s
      retries: 6

  plc-power:
    <<: *common
    build: ./plc/power-s7
    container_name: crosscreek-plc-power
    environment:
      S7_NO_PASSWORD: "${S7_NO_PASSWORD:-1}"
      PLC_POWER_PASS: "${PLC_POWER_PASS:-1100}"
    ports:
      - "127.0.0.1:1020:102"     # S7comm
    networks:
      ot-net:  { ipv4_address: 172.30.40.22 }
      sim-net: { ipv4_address: 172.30.50.12 }
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',102),3)\""]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- L0 the physical process -----------------------------------------
  process-sim:
    <<: *common
    build: ./process-sim
    container_name: crosscreek-process-sim
    depends_on:
      plc-water:  { condition: service_healthy }
      plc-dosing: { condition: service_healthy }
      plc-power:  { condition: service_healthy }
    environment:
      PLC_WATER_HOST: "172.30.50.10"
      PLC_POWER_HOST: "172.30.50.12"
      PLC_DOSING_HOST: "172.30.50.11"
      TICK_SECONDS: "1.0"
    networks:
      sim-net: { ipv4_address: 172.30.50.5 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- L2 operator interfaces ----------------------------------------
  hmi-water:
    <<: *common
    build: ./hmi/water
    container_name: crosscreek-hmi-water
    environment:
      PLC_MODBUS_HOST: "172.30.40.20"
      DEFAULT_CREDS: "${DEFAULT_CREDS:-1}"
      HMI_ADMIN_USER: "${HMI_ADMIN_USER:-admin}"
      HMI_ADMIN_PASS: "${HMI_ADMIN_PASS:-admin}"
      VERBOSE_HMI_ERRORS: "${VERBOSE_HMI_ERRORS:-1}"
    ports:
      - "127.0.0.1:8071:8080"
    networks:
      ot-net: { ipv4_address: 172.30.40.10 }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 6

  hmi-power:
    <<: *common
    build: ./hmi/power
    container_name: crosscreek-hmi-power
    environment:
      PLC_S7_HOST: "172.30.40.22"
      DEFAULT_CREDS: "${DEFAULT_CREDS:-1}"
      HMI_ADMIN_USER: "${HMI_ADMIN_USER:-admin}"
      HMI_ADMIN_PASS: "${HMI_ADMIN_PASS:-admin}"
      VERBOSE_HMI_ERRORS: "${VERBOSE_HMI_ERRORS:-1}"
    ports:
      - "127.0.0.1:8072:8080"
    networks:
      ot-net: { ipv4_address: 172.30.40.11 }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 6

  # --- L3 engineering workstation (the pivot box) ---------------------
  eng-ws:
    <<: *common
    build: ./eng-ws
    container_name: crosscreek-eng-ws
    environment:
      EXPOSE_REMOTE_ACCESS: "${EXPOSE_REMOTE_ACCESS:-1}"
    networks:
      it-net: { ipv4_address: 172.30.20.20 }
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/projects/README.txt"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- L3.5 data historian -----------------------------------------
  historian:
    <<: *common
    build: ./historian
    container_name: crosscreek-historian
    environment:
      HISTORIAN_READONLY: "${HISTORIAN_READONLY:-0}"
      POLL_MODBUS: "172.30.40.20:502"
      POLL_S7: "172.30.40.22:102"
    volumes:
      - historian-data:/var/lib/historian
    networks:
      it-net:  { ipv4_address: 172.30.20.30 }
      dmz-net: { ipv4_address: 172.30.30.30 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  # --- the utility's authoritative name server -----------------------
  # A real small utility runs one for its public web/VPN presence; often it
  # also answers for the internal estate and, on legacy configs, lets anyone
  # pull the whole zone. Flat build: full forward + reverse zones, AXFR open.
  # Segmented build: split-horizon public view only, AXFR refused.
  dns:
    <<: *common
    build: ./net/dns
    container_name: crosscreek-dns
    environment:
      DNS_AXFR_OPEN: "${DNS_AXFR_OPEN:-1}"
    networks:
      edge-net: { ipv4_address: 172.30.10.53 }
    healthcheck:
      test: ["CMD-SHELL", "nslookup ns1.crosscreek-water.lab 127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- attacker workstation, boxed in --------------------------------
  attacker:
    <<: *common
    build: ./attacker
    container_name: crosscreek-attacker
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on:
      dns: { condition: service_healthy }
    environment:
      ROUTER_EDGE_IP: "172.30.10.2"
      LAB_SUBNETS: "172.30.0.0/16"
    dns:
      - 172.30.10.53
    dns_search:
      - crosscreek-water.lab
      - crosscreek-power.lab
    networks:
      edge-net: { ipv4_address: 172.30.10.10 }

networks:
  # The attacker box lives only on edge-net and holds no default route (its
  # entrypoint blackholes one), so it cannot reach the host LAN or the
  # internet; it routes to the rest of the range only through the firewall.
  # status.sh probes actual reachability to confirm. edge-net is NOT marked
  # internal because that would also stop the attacker routing through the
  # firewall, which several scenarios need.
  edge-net:
    driver: bridge
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  it-net:
    driver: bridge
    ipam: { config: [{ subnet: 172.30.20.0/24 }] }
  dmz-net:
    driver: bridge
    ipam: { config: [{ subnet: 172.30.30.0/24 }] }
  ot-net:
    driver: bridge
    ipam: { config: [{ subnet: 172.30.40.0/24 }] }
  sim-net:
    driver: bridge
    internal: true
    ipam: { config: [{ subnet: 172.30.50.0/24 }] }

volumes:
  historian-data:
