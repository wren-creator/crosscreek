<!doctype html>
<meta charset="utf-8">
<title>Cross Creek RO Plant &mdash; Sign In</title>
<style>
  body{background:#0e1518;color:#dfe9ef;font-family:"Segoe UI",system-ui,sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
  .panel{background:#22434d;border-radius:14px;padding:16px 20px 20px}
  .bez{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px}
  .bez .s{color:#eef4f6;font-weight:800;letter-spacing:.14em}
  .bez .h{color:#7fa7b2;font-weight:600;letter-spacing:.16em;font-size:.85em}
  .screen{background:#c3d3da;border:2px solid #16323b;padding:2em 2.4em;width:320px;color:#12324a}
  h1{font-size:1em;letter-spacing:.06em;text-transform:uppercase;color:#1b5e8a;margin:.2em 0 1.2em}
  label{display:block;font-size:.8em;margin:.9em 0 .25em}
  input{width:100%;padding:.5em;background:#eef4f6;border:1px solid #9fb0b7;color:#12324a}
  button{margin-top:1.4em;width:100%;padding:.6em;background:#2b5c86;border:0;color:#fff;
         font-weight:600;letter-spacing:.05em;cursor:pointer}
  .err{color:#c02626;font-size:.85em;margin-top:1em}
  .hint{color:#5b7a86;font-size:.75em;margin-top:1.4em;border-top:1px dashed #9fb0b7;padding-top:.8em}
</style>
<div class="panel">
  <div class="bez"><span class="s">STEMENS</span><span class="h">SIMATIX HMI</span></div>
  <form class="screen" method="post">
    <h1>Cross Creek RO &mdash; Sign In</h1>
    <label>Operator ID</label>
    <input name="username" autofocus autocomplete="off">
    <label>Password</label>
    <input name="password" type="password">
    <button>Sign in</button>
    {% if err %}<div class="err">{{ err }}</div>{% endif %}
    {% if hint %}<div class="hint">Factory default account is still active.</div>{% endif %}
  </form>
</div>
