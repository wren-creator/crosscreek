#!/usr/sbin/nft -f
# FLAT ruleset: the boundary does nothing but route. This is the state most
# small utilities are actually in, and it is what makes the Session 2-4
# attacks work from the edge network.

flush ruleset

table inet filter {
  chain forward {
    type filter hook forward priority 0; policy accept;
  }
}

# SNAT so replies from the internal segments find their way back to the
# attacker (which sits on an internal-only bridge with no route of its own).
table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100; policy accept;
    ip saddr 172.30.0.0/16 masquerade;
  }
}
