#!/usr/sbin/nft -f
# SEGMENTED ruleset: zones and conduits per ISA/IEC 62443. Default drop on the
# forward path; only the flows a real utility should permit are allowed, and
# every denied cross-zone packet is logged for the IDS and for `nft` counters.
#
# Zones:   edge 172.30.10  |  IT 172.30.20  |  DMZ 172.30.30  |  OT 172.30.40
# Conduits allowed:
#   IT  <-> DMZ            (historian UI, jump-host management)
#   DMZ jump host  -> OT   ssh + HMI http, for sanctioned remote engineering
#   DMZ historian  -> OT   Modbus/S7 read, one-way (also enforced app-side)
# Everything else crossing a zone boundary is dropped. The edge zone reaches
# nothing.

flush ruleset

define JUMP  = 172.30.30.40
define HIST  = 172.30.30.30
define OT    = 172.30.40.0/24

table inet filter {
  chain forward {
    type filter hook forward priority 0; policy drop;

    ct state established,related accept

    # IT <-> DMZ
    ip saddr 172.30.20.0/24 ip daddr 172.30.30.0/24 accept
    ip saddr 172.30.30.0/24 ip daddr 172.30.20.0/24 accept

    # DMZ jump host -> OT (remote engineering path)
    ip saddr $JUMP ip daddr $OT tcp dport { 22, 8080 } accept

    # DMZ historian -> OT (data collection, one-way). Field-protocol ports are
    # off their IANA defaults, see .env.example (PLC_WATER_PORT / PLC_POWER_PORT
    # / PLC_DOSING_PORT); update this set to match if you change them.
    ip saddr $HIST ip daddr $OT tcp dport { 10502, 10102, 54818 } accept

    # anything else that crosses a zone boundary
    log prefix "CC-FW-DROP " counter drop
  }
}

table ip nat {
  chain postrouting {
    type nat hook postrouting priority 100; policy accept;
    ip saddr 172.30.20.0/24 ip daddr 172.30.30.0/24 masquerade
    ip saddr 172.30.30.0/24 ip daddr 172.30.20.0/24 masquerade
    ip saddr $JUMP ip daddr $OT masquerade
    ip saddr $HIST ip daddr $OT masquerade
  }
}
